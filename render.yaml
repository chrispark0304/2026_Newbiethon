# Render Blueprint. 대시보드에서 New > Blueprint 로 이 저장소를 연결하면 읽어 간다.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gachisaljip-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore            # Render 리전 중 한국에서 가장 가깝다
    healthCheckPath: /api/health
    autoDeploy: true             # main 에 push 하면 자동 재배포
    envVars:
      # 대시보드에서 직접 넣는다(sync:false = Blueprint에 값이 안 들어감).
      - key: KAKAO_REST_API_KEY
        sync: false
      # 프론트 배포 후 그 도메인을 넣는다. 비우면 로컬 주소만 허용된다.
      - key: CORS_ORIGINS
        sync: false
      - key: COMMUTE_PROVIDER
        value: hybrid
      - key: KAKAO_DAILY_BUDGET
        value: "900"
