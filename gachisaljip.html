<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<title>같이살집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F4F6F2;
    --surface: #FFFFFF;
    --surface-2: #EDF1EB;
    --ink: #17201B;
    --muted: #5E6B64;
    --line: #D9E0D9;
    --me: #1E6E5A;
    --me-soft: #DCEFE7;
    --friend: #4B51A6;
    --friend-soft: #E3E4F6;
    --joint: #17201B;
    --warn: #B2531C;
    --warn-soft: #F8E6DB;
    --good: #1E6E5A;
    --shadow: 0 12px 32px rgba(23, 32, 27, .12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131A16; --surface: #1B231E; --surface-2: #232D27; --ink: #EEF2EE; --muted: #9AA8A0;
      --line: #2E3A33; --me: #5FC3A5; --me-soft: #1D3A31; --friend: #9AA0EE; --friend-soft: #262A4E;
      --joint: #EEF2EE; --warn: #E89A6A; --warn-soft: #3E2A1C; --good: #5FC3A5;
      --shadow: 0 12px 32px rgba(0,0,0,.45); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131A16; --surface: #1B231E; --surface-2: #232D27; --ink: #EEF2EE; --muted: #9AA8A0;
    --line: #2E3A33; --me: #5FC3A5; --me-soft: #1D3A31; --friend: #9AA0EE; --friend-soft: #262A4E;
    --joint: #EEF2EE; --warn: #E89A6A; --warn-soft: #3E2A1C; --good: #5FC3A5;
    --shadow: 0 12px 32px rgba(0,0,0,.45); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; padding-block: 28px 80px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .brand small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 10px; letter-spacing: 0; }
  .tag { font-size: 12px; color: var(--muted); }

  /* search panel */
  .search { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 0; overflow: hidden; }
  .person { padding: 4px 16px 4px 0; }
  .person + .person { border-left: 1px solid var(--line); padding: 4px 0 4px 20px; }
  .person-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .p1 .dot { background: var(--me); } .p2 .dot { background: var(--friend); }
  .name-input { font: inherit; font-weight: 600; font-size: 16px; border: none; background: transparent; color: var(--ink); border-bottom: 1px dashed var(--line); padding: 2px 0; width: 8em; }
  .name-input:focus { outline: none; border-bottom-color: var(--ink); }
  .field { display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .field label { font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
  .field select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); grid-column: 2 / 4; }
  .field input[type=range] { width: 100%; accent-color: var(--ink); }
  .p1 .field input[type=range] { accent-color: var(--me); } .p2 .field input[type=range] { accent-color: var(--friend); }
  .val { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 5.2em; text-align: right; }
  .seg { display: flex; gap: 4px; grid-column: 2 / 4; }
  .seg button { flex: 1; font: inherit; font-size: 13px; padding: 6px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { color: var(--ink); border-color: currentColor; background: var(--surface); font-weight: 600; }
  .p1 .seg button[aria-pressed="true"] { color: var(--me); background: var(--me-soft); }
  .p2 .seg button[aria-pressed="true"] { color: var(--friend); background: var(--friend-soft); }
  .search-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .search-foot .hint { font-size: 12.5px; color: var(--muted); }
  .cta { font: inherit; font-size: 15px; font-weight: 700; padding: 12px 26px; border-radius: 10px; border: none; background: var(--ink); color: var(--bg); cursor: pointer; }
  .cta:hover { opacity: .92; }

  /* results */
  .results-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 28px 0 12px; }
  .results-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .results-head h2 span { color: var(--muted); font-weight: 500; }
  .tabs { display: flex; gap: 2px; background: var(--surface-2); border-radius: 10px; padding: 3px; }
  .tabs button { font: inherit; font-size: 13.5px; padding: 6px 14px; border-radius: 8px; border: none; background: transparent; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .list { display: grid; gap: 10px; }
  .card { display: grid; grid-template-columns: 1.3fr 1fr 1.2fr auto; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--muted); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
  .card .place { font-weight: 600; font-size: 16px; }
  .card .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .card .rent { font-variant-numeric: tabular-nums; }
  .card .rent b { font-size: 18px; font-weight: 700; }
  .card .rent .split { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .commute { display: grid; gap: 4px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .commute div { display: flex; align-items: center; gap: 8px; }
  .commute .dot { width: 8px; height: 8px; }
  .commute em { font-style: normal; color: var(--muted); }
  .score { text-align: right; }
  .score b { display: block; font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .score span { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
  .pair { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .pair i { font-style: normal; padding: 1px 7px; border-radius: 999px; }
  .pair .a { background: var(--me-soft); color: var(--me); } .pair .b { background: var(--friend-soft); color: var(--friend); }
  .badge { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; margin-left: 6px; vertical-align: middle; }
  .badge.best { background: var(--me-soft); color: var(--me); }

  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(10, 14, 12, .45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(480px, 100%); background: var(--surface); box-shadow: var(--shadow); transform: translateX(100%); transition: transform .25s; z-index: 11; overflow-y: auto; padding: 24px 24px 40px; }
  body.open .scrim { opacity: 1; pointer-events: auto; } body.open .drawer { transform: none; }
  @media (prefers-reduced-motion: reduce) { .drawer, .scrim, .card { transition: none; } }
  .drawer .close { position: absolute; top: 14px; right: 14px; font: inherit; font-size: 20px; line-height: 1; border: none; background: var(--surface-2); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; }
  .d-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 6px 40px 2px 0; text-wrap: balance; }
  .d-sub { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }
  .joint-box { display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; }
  .joint-box .big { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .joint-box .lab { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .joint-box .why { font-size: 13px; max-width: 220px; color: var(--ink); }
  .section { margin-top: 20px; }
  .section h4 { margin: 0 0 8px; font-size: 12.5px; letter-spacing: .06em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .room { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .room .who { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
  .room .sz { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .room .sz small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .room .pay { font-size: 14px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .room .pay b { font-size: 18px; }
  .room .over { color: var(--warn); font-size: 12px; }
  .room .cm { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .swap { font: inherit; font-size: 13.5px; font-weight: 600; margin-top: 10px; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .swap:hover { background: var(--surface-2); }
  .swap[aria-pressed="true"] { border-color: var(--ink); }
  .bars { display: grid; gap: 12px; }
  .bar-row { display: grid; grid-template-columns: 92px 1fr 40px; align-items: center; gap: 10px; font-size: 13px; }
  .bar-row .lbl { color: var(--muted); }
  .track { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
  .fill { height: 100%; border-radius: 999px; }
  .bar-row .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .person-score { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
  .person-score b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .formula { font-size: 12.5px; color: var(--muted); line-height: 1.6; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .formula code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
  .compare { font-size: 13px; color: var(--muted); margin-top: 8px; }

  @media (max-width: 720px) {
    .search { grid-template-columns: 1fr; }
    .person { padding: 4px 0; }
    .person + .person { border-left: none; border-top: 1px solid var(--line); padding: 16px 0 4px; margin-top: 8px; }
    .card { grid-template-columns: 1fr auto; }
    .card .commute { grid-column: 1 / -1; }
    .card .score { grid-column: 2; grid-row: 1; }
  }
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">같이살집 <small>2인 공동 자취방 의사결정</small></h1>
    <div class="tag">해커톤 프로토타입 · 매물·통근시간은 예시 데이터</div>
  </header>

  <section class="search" aria-label="조건 입력">
    <div class="person p1">
      <div class="person-head"><span class="dot"></span><input class="name-input" id="name1" value="재윤" aria-label="첫 번째 사람 이름"></div>
      <div class="field"><label for="dest1">직장·학교</label><select id="dest1"></select></div>
      <div class="field"><label for="tmax1">통근 한도</label><input type="range" id="tmax1" min="10" max="80" step="5" value="30"><span class="val" id="tmax1v">30분</span></div>
      <div class="field"><label for="bud1">월 예산</label><input type="range" id="bud1" min="30" max="120" step="5" value="60"><span class="val" id="bud1v">60만 원</span></div>
      <div class="field"><label>방 크기</label><div class="seg" id="size1" role="group" aria-label="방 크기 선호"></div></div>
    </div>
    <div class="person p2">
      <div class="person-head"><span class="dot"></span><input class="name-input" id="name2" value="친구" aria-label="두 번째 사람 이름"></div>
      <div class="field"><label for="dest2">직장·학교</label><select id="dest2"></select></div>
      <div class="field"><label for="tmax2">통근 한도</label><input type="range" id="tmax2" min="10" max="80" step="5" value="40"><span class="val" id="tmax2v">40분</span></div>
      <div class="field"><label for="bud2">월 예산</label><input type="range" id="bud2" min="30" max="120" step="5" value="70"><span class="val" id="bud2v">70만 원</span></div>
      <div class="field"><label>방 크기</label><div class="seg" id="size2" role="group" aria-label="방 크기 선호"></div></div>
    </div>
    <div class="search-foot">
      <div class="hint">둘의 예산 합 <b id="budsum">130만 원</b> · 매물마다 방 배정과 월세 분담을 자동으로 찾아 둘 다 만족하는 순으로 정렬합니다.</div>
      <button class="cta" id="go">우리 집 찾기</button>
    </div>
  </section>

  <div class="results-head">
    <h2 id="count">추천 매물</h2>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-sort="joint" aria-selected="true">공평한 순</button>
      <button role="tab" data-sort="rent" aria-selected="false">최저가 순</button>
      <button role="tab" data-sort="commute" aria-selected="false">통근 짧은 순</button>
    </div>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="매물 상세"></aside>

<script>
// ---------- 데이터 (예시) ----------
const DESTS = [
  ["고려대", 37.589, 127.032], ["연세대", 37.566, 126.938], ["강남역", 37.498, 127.028], ["판교", 37.395, 127.111],
  ["여의도", 37.522, 126.924], ["광화문", 37.571, 126.977], ["성수", 37.544, 127.056], ["홍대입구", 37.557, 126.924],
  ["서울대", 37.460, 126.952], ["한양대", 37.556, 127.044], ["잠실", 37.513, 127.100], ["구로디지털단지", 37.485, 126.901],
];
const HOODS = {
  "안암": [37.586, 127.029], "왕십리": [37.561, 127.037], "신촌": [37.555, 126.937], "건대입구": [37.540, 127.069],
  "사당": [37.476, 126.981], "신림": [37.484, 126.929], "노원": [37.655, 127.061], "공덕": [37.544, 126.951],
  "성수": [37.544, 127.056], "회기": [37.590, 127.058], "신설동": [37.575, 127.025], "약수": [37.554, 127.011],
  "홍대": [37.557, 126.924], "역삼": [37.500, 127.036], "흑석": [37.508, 126.963], "상도": [37.503, 126.948],
  "합정": [37.550, 126.914], "청량리": [37.580, 127.047], "수유": [37.638, 127.025], "길음": [37.603, 127.025],
};
// [동네, 설명, 총월세(만), 큰방㎡, 작은방㎡]
const LISTINGS = [
  ["안암", "투룸 · 3층 · 엘리베이터", 110, 9, 6], ["안암", "투룸 · 반지하 · 넓음", 85, 11, 8], ["왕십리", "투룸 · 오피스텔 12층", 125, 8, 7],
  ["왕십리", "투룸 · 빌라 2층", 100, 10, 6], ["신촌", "투룸 · 5층 · 역 3분", 130, 8, 8], ["건대입구", "투룸 · 신축 4층", 120, 9, 7],
  ["사당", "투룸 · 빌라 3층", 105, 10, 7], ["신림", "투룸 · 2층 · 넓음", 80, 11, 9], ["노원", "투룸 · 아파트 8층", 75, 12, 9],
  ["공덕", "투룸 · 오피스텔 9층", 140, 9, 8], ["성수", "투룸 · 리모델링 2층", 135, 10, 7], ["회기", "투룸 · 4층", 90, 9, 6],
  ["신설동", "투룸 · 3층 · 역 5분", 95, 8, 7], ["약수", "투룸 · 빌라 1층", 105, 10, 8], ["홍대", "투룸 · 6층 · 역 2분", 145, 8, 7],
  ["역삼", "투룸 · 오피스텔 15층", 160, 8, 8], ["흑석", "투룸 · 3층", 100, 9, 7], ["상도", "투룸 · 2층 · 넓음", 90, 11, 8],
  ["합정", "투룸 · 4층", 125, 9, 6], ["청량리", "투룸 · 신축 7층", 100, 9, 8], ["수유", "투룸 · 빌라 2층", 70, 12, 10],
  ["길음", "투룸 · 아파트 5층", 95, 11, 8],
].map((r, i) => ({ id: i, hood: r[0], desc: r[1], rent: r[2], rooms: [r[3], r[4]] }));

// 통근시간 추정: 직선거리 기반 (실서비스는 ODsay/카카오 길찾기 API로 교체)
function km(a, b) {
  const R = 6371, dLat = (b[0]-a[0]) * Math.PI/180, dLng = (b[1]-a[1]) * Math.PI/180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180) * Math.cos(b[0]*Math.PI/180) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function commute(hood, destIdx) {
  const d = km(HOODS[hood], [DESTS[destIdx][1], DESTS[destIdx][2]]);
  const jitter = (hood.length * 7 + destIdx * 13) % 5; // 결정적 잡음
  return Math.round(d < 1.2 ? 6 + d * 10 : 9 + d * 3 + jitter);
}

// ---------- 점수 산식 ----------
const SIZE_PREF = [["작아도 됨", 1], ["보통", 3], ["넓게", 5]];
const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));
const slack = (x, limit) => clamp(60 + 80 * (limit - x) / limit);   // 한도 딱 = 60, 절반 = 100
const sizeScore = (sqm) => clamp(sqm / 10 * 100);
function personScore(p, share, minutes, sqm) {
  const w = { money: 3, commute: 3, size: p.sizeW };
  const tot = w.money + w.commute + w.size;
  const s = { money: slack(share, p.budget), commute: slack(minutes, p.tmax), size: sizeScore(sqm) };
  return { ...s, total: (s.money * w.money + s.commute * w.commute + s.size * w.size) / tot, w: { money: w.money/tot, commute: w.commute/tot, size: w.size/tot } };
}
const jointScore = (a, b) => (a + b) / 2 - 0.3 * Math.abs(a - b);

// 매물 하나에 대해: 방 배정 2가지 × 분담금 1만 원 단위 스캔 → 공동 적합도 최대
function evaluate(listing, p1, p2, forceAssign) {
  const m1 = commute(listing.hood, p1.dest), m2 = commute(listing.hood, p2.dest);
  let best = null;
  const assigns = forceAssign == null ? [0, 1] : [forceAssign];
  for (const a of assigns) {                // a=0: p1 큰 방, a=1: p1 작은 방
    const r1 = listing.rooms[a], r2 = listing.rooms[1 - a];
    for (let s1 = 0; s1 <= listing.rent; s1++) {
      const s2 = listing.rent - s1;
      const A = personScore(p1, s1, m1, r1), B = personScore(p2, s2, m2, r2);
      const j = jointScore(A.total, B.total);
      if (!best || j > best.joint + 1e-9) best = { joint: j, assign: a, share: [s1, s2], scores: [A, B], rooms: [r1, r2], minutes: [m1, m2] };
    }
  }
  return best;
}

// ---------- 상태 & UI ----------
const $ = (id) => document.getElementById(id);
const state = { p: [{ name: "재윤", dest: 0, tmax: 30, budget: 60, sizeW: 5 }, { name: "친구", dest: 2, tmax: 40, budget: 70, sizeW: 1 }], sort: "joint", results: [], openId: null, swapped: false };

for (const i of [1, 2]) {
  const sel = $("dest" + i);
  DESTS.forEach((d, k) => { const o = document.createElement("option"); o.value = k; o.textContent = d[0]; sel.append(o); });
  sel.value = state.p[i-1].dest;
  const seg = $("size" + i);
  SIZE_PREF.forEach(([label, w]) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.dataset.w = w;
    b.setAttribute("aria-pressed", String(state.p[i-1].sizeW === w));
    b.onclick = () => { state.p[i-1].sizeW = w; [...seg.children].forEach(c => c.setAttribute("aria-pressed", String(c === b))); run(); };
    seg.append(b);
  });
  $("tmax" + i).oninput = (e) => { state.p[i-1].tmax = +e.target.value; $("tmax" + i + "v").textContent = e.target.value + "분"; };
  $("bud" + i).oninput = (e) => { state.p[i-1].budget = +e.target.value; $("bud" + i + "v").textContent = e.target.value + "만 원"; $("budsum").textContent = (state.p[0].budget + state.p[1].budget) + "만 원"; };
  $("name" + i).oninput = (e) => { state.p[i-1].name = e.target.value || (i === 1 ? "나" : "친구"); };
  sel.onchange = (e) => { state.p[i-1].dest = +e.target.value; };
}
$("go").onclick = run;
$("tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; state.sort = b.dataset.sort; [...$("tabs").children].forEach(c => c.setAttribute("aria-selected", String(c === b))); render(); };
$("scrim").onclick = closeDrawer;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

const won = (n) => n + "만";
function run() {
  const [p1, p2] = state.p;
  state.results = LISTINGS.map(l => ({ l, r: evaluate(l, p1, p2) }));
  render();
}
function sorted() {
  const r = [...state.results];
  if (state.sort === "rent") r.sort((a, b) => a.l.rent - b.l.rent || b.r.joint - a.r.joint);
  else if (state.sort === "commute") r.sort((a, b) => (a.r.minutes[0] + a.r.minutes[1]) - (b.r.minutes[0] + b.r.minutes[1]) || b.r.joint - a.r.joint);
  else r.sort((a, b) => b.r.joint - a.r.joint);
  return r;
}
function render() {
  const [p1, p2] = state.p;
  const rows = sorted();
  const bestId = state.results.reduce((m, x) => x.r.joint > m.r.joint ? x : m).l.id;
  $("count").innerHTML = `추천 매물 <span>${rows.length}곳 · ${p1.name}는 ${DESTS[p1.dest][0]}, ${p2.name}는 ${DESTS[p2.dest][0]}</span>`;
  $("list").innerHTML = rows.map(({ l, r }) => {
    const over = l.rent > p1.budget + p2.budget;
    const big = r.assign === 0 ? p1.name : p2.name;
    return `<button class="card" data-id="${l.id}">
      <div><div class="place">${l.hood}${l.id === bestId && state.sort === "joint" ? '<span class="badge best">가장 공평</span>' : ""}${over ? '<span class="badge">예산 합 초과</span>' : ""}</div><div class="sub">${l.desc} · ${l.rooms[0]}㎡ / ${l.rooms[1]}㎡</div></div>
      <div class="rent"><b>${l.rent}만 원</b><div class="split">${big}가 큰 방 · ${won(r.share[0])} / ${won(r.share[1])}</div></div>
      <div class="commute">
        <div><span class="dot" style="background:var(--me)"></span>${r.minutes[0]}분 <em>${p1.name} → ${DESTS[p1.dest][0]}</em></div>
        <div><span class="dot" style="background:var(--friend)"></span>${r.minutes[1]}분 <em>${p2.name} → ${DESTS[p2.dest][0]}</em></div>
      </div>
      <div class="score"><b>${Math.round(r.joint)}</b><span>공동 적합도</span><div class="pair"><i class="a">${Math.round(r.scores[0].total)}</i><i class="b">${Math.round(r.scores[1].total)}</i></div></div>
    </button>`;
  }).join("");
  $("list").querySelectorAll(".card").forEach(c => c.onclick = () => openDrawer(+c.dataset.id));
  if (state.openId != null) renderDrawer();
}

function openDrawer(id) { state.openId = id; state.swapped = false; renderDrawer(); document.body.classList.add("open"); }
function closeDrawer() { document.body.classList.remove("open"); state.openId = null; }

function why(r, p1, p2, l) {
  const [a, b] = r.share, half = l.rent / 2;
  const payer = a > b ? p1 : b > a ? p2 : null;
  if (!payer) return "둘이 정확히 반씩 낼 때가 가장 공평해요.";
  const diff = Math.abs(a - b);
  const bigWho = r.assign === 0 ? p1 : p2;
  const reason = payer === bigWho ? `큰 방(${Math.max(...r.rooms)}㎡)을 쓰니` : `방은 작지만 상대가 돈에 더 민감하니`;
  return `${state.swapped ? "이 배정에서는 " : ""}${payer.name}가 ${reason} 반반보다 ${Math.round(diff/2)}만 원 더 내는 게 둘 다에게 낫습니다.`;
}

function renderDrawer() {
  const { l } = state.results.find(x => x.l.id === state.openId);
  const [p1, p2] = state.p;
  const auto = evaluate(l, p1, p2);
  const r = state.swapped ? evaluate(l, p1, p2, 1 - auto.assign) : auto;
  const ppl = [p1, p2];
  const colors = ["var(--me)", "var(--friend)"];
  const roomCard = (i) => {
    const p = ppl[i], sc = r.scores[i];
    return `<div class="room">
      <div class="who"><span class="dot" style="background:${colors[i]}"></span>${p.name}</div>
      <div class="sz">${r.rooms[i]}<small>㎡ ${r.rooms[i] === Math.max(...l.rooms) && l.rooms[0] !== l.rooms[1] ? "큰 방" : l.rooms[0] === l.rooms[1] ? "" : "작은 방"}</small></div>
      <div class="pay"><b>${r.share[i]}만 원</b> / 예산 ${p.budget}만 ${r.share[i] > p.budget ? `<div class="over">예산보다 ${r.share[i]-p.budget}만 원 초과</div>` : ""}</div>
      <div class="cm">${DESTS[p.dest][0]}까지 ${r.minutes[i]}분 (한도 ${p.tmax}분)</div>
    </div>`;
  };
  const bars = (i) => {
    const sc = r.scores[i];
    const row = (lbl, key) => `<div class="bar-row"><span class="lbl">${lbl} <small>×${sc.w[key].toFixed(2)}</small></span><div class="track"><div class="fill" style="width:${sc[key]}%;background:${colors[i]}"></div></div><span class="n">${Math.round(sc[key])}</span></div>`;
    return `<div class="person-score"><span style="color:${colors[i]}">${ppl[i].name}</span><b>${Math.round(sc.total)}점</b></div><div class="bars">${row("돈", "money")}${row("교통", "commute")}${row("방 크기", "size")}</div>`;
  };
  $("drawer").innerHTML = `
    <button class="close" aria-label="닫기" id="closeBtn">×</button>
    <div class="d-title">${l.hood} ${l.desc.split(" · ")[0]}</div>
    <div class="d-sub">${l.desc} · 총 월세 ${l.rent}만 원 · 방 ${l.rooms[0]}㎡ / ${l.rooms[1]}㎡</div>
    <div class="joint-box"><div><div class="big">${Math.round(r.joint)}</div><div class="lab">공동 적합도</div></div><div class="why">${why(r, p1, p2, l)}</div></div>
    <div class="section"><h4>방 배정 · 추천 분담</h4><div class="rooms">${roomCard(0)}${roomCard(1)}</div>
      <button class="swap" id="swapBtn" aria-pressed="${state.swapped}">${state.swapped ? "추천 배정으로 되돌리기" : "방 바꾸면 어떻게 되나요?"}</button>
      ${state.swapped ? `<div class="compare">추천 배정일 때 공동 적합도 ${Math.round(auto.joint)} → 바꾸면 ${Math.round(r.joint)} (${Math.round(r.joint - auto.joint) > 0 ? "+" : ""}${Math.round(r.joint - auto.joint)})</div>` : ""}
    </div>
    <div class="section"><h4>항목별 만족도</h4><div style="display:grid;gap:18px">${[0,1].map(bars).join("")}</div></div>
    <div class="section"><h4>계산 방식</h4><div class="formula">
      돈·교통은 한도 대비 여유: <code>60 + 80 × (한도 − 값) / 한도</code>, 한도에 딱 맞으면 60점.<br>
      방 크기는 <code>㎡ / 10 × 100</code>, 10㎡ 이상 만점.<br>
      개인 점수 = 가중 평균 (돈 3 · 교통 3 · 방 크기 ${SIZE_PREF.map(s=>s[1]).join("/")}).<br>
      공동 적합도 = 두 사람 평균 − 0.3 × 격차. 방 배정 2가지 × 분담금 1만 원 단위를 전부 계산해 최댓값을 고릅니다.
    </div></div>`;
  $("closeBtn").onclick = closeDrawer;
  $("swapBtn").onclick = () => { state.swapped = !state.swapped; renderDrawer(); };
}

run();
</script>

</body></html>
